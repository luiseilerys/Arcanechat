# Workflow para generar la APK de GuaguaPass de forma MANUAL.
# Cómo usarlo: GitHub -> Actions -> "Build GuaguaPass APK (Manual)" ->
# "Run workflow" -> elegir parámetros -> "Run workflow".
#
# La APK se compila con guaguapass/build.sh (aapt2 + javac + d8 + zipalign +
# apksigner, sin Gradle) y queda firmada con el keystore de debug del propio
# script (out/guagua.keystore). Resultado: guaguapass/out/GuaguaPass.apk,
# que se sube como artefacto descargable.
name: Build GuaguaPass APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_server:
        description: "Incluir también el empaquetado del servidor Node.js (server/dist-guaguaserver.tar.gz)"
        type: boolean
        required: true
        default: false
      artifact_name:
        description: "Nombre del artefacto APK a descargar"
        type: string
        required: false
        default: "GuaguaPass.apk"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar GuaguaPass.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar JDK 17 (necesario para javac/keytool/apksigner)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      # Se instala SOLO cmdline-tools (sin el paquete obsoleto 'tools', que era
      # la causa del error "Failed to find package 'tools'"). El resto de
      # componentes se instalan explícitamente con sdkmanager.
      - name: Instalar Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-approved-licenses: true

      - name: Instalar componentes exactos que usa build.sh
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          # Verificación temprana: si falta algo, falla aquí y no en build.sh
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Compilar la APK (guaguapass/build.sh)
        working-directory: guaguapass
        run: |
          chmod +x build.sh
          ./build.sh
          ls -lh out/GuaguaPass.apk

      - name: Verificar firma de la APK
        working-directory: guaguapass
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs out/GuaguaPass.apk

      - name: (Opcional) Empaquetar el servidor Node.js
        if: inputs.build_server == true
        run: |
          node --check guaguapass/server/server.js
          mkdir -p server-dist
          tar -czf "server-dist/guaguaserver.tar.gz" -C guaguapass server README.md
          ls -lh server-dist/guaguaserver.tar.gz

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: guaguapass/out/GuaguaPass.apk
          if-no-files-found: error

      - name: (Opcional) Subir servidor como artefacto
        if: inputs.build_server == true
        uses: actions/upload-artifact@v4
        with:
          name: guaguaserver.tar.gz
          path: server-dist/guaguaserver.tar.gz
          if-no-files-found: ignore
