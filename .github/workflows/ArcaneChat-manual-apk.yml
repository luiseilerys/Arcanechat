# Workflow para generar la APK de ArcaneChat de forma MANUAL.
# Cómo usarlo: GitHub -> Actions -> "Build ArcaneChat APK (Manual)" ->
# "Run workflow" -> elegir parámetros -> "Run workflow".
name: Build ArcaneChat APK (Manual)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor de la app a compilar"
        type: choice
        required: true
        default: foss
        options:
          - foss
          - gplay
      build_type:
        description: "Tipo de compilación"
        type: choice
        required: true
        default: Debug
        options:
          - Debug
          - Release
      abi_filter:
        description: "ABI a compilar (all = APK universal + splits por ABI)"
        type: choice
        required: true
        default: arm64-v8a
        options:
          - all
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ArcaneChat APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up NDK r27
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27

      - name: Rust cache for deltachat-core-rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: jni/deltachat-core-rust

      - name: Get deltachat-core-rust submodule hash
        id: core-hash
        run: echo "hash=$(git rev-parse HEAD:jni/deltachat-core-rust)" >> $GITHUB_OUTPUT

      - name: Restore compiled core
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            jni/arm64-v8a
            libs/arm64-v8a
          key: core-arm64-v8a-${{ steps.core-hash.outputs.hash }}-${{ hashFiles('jni/Android.mk', 'jni/Application.mk', 'jni/dc_wrapper.c', 'scripts/ndk-make.sh') }}-ndk-r27

      - name: Compile core (native libraries)
        if: steps.core-cache.outputs.cache-hit != 'true' && inputs.abi_filter != 'all'
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="${PATH}:${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/"
          scripts/install-toolchains.sh && scripts/ndk-make.sh ${{ inputs.abi_filter }}

      - name: Compile core (all ABIs)
        if: steps.core-cache.outputs.cache-hit != 'true' && inputs.abi_filter == 'all'
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="${PATH}:${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/"
          scripts/install-toolchains.sh && scripts/ndk-make.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          if [ "${{ inputs.abi_filter }}" = "all" ]; then
            ./gradlew --no-daemon assemble${{ inputs.flavor }}${{ inputs.build_type }}
          else
            ./gradlew --no-daemon -PABI_FILTER=${{ inputs.abi_filter }} assemble${{ inputs.flavor }}${{ inputs.build_type }}
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneChat-${{ inputs.flavor }}-${{ inputs.build_type }}-${{ inputs.abi_filter }}
          path: 'build/outputs/apk/${{ inputs.flavor }}/${{ inputs.build_type }}/*.apk'
          if-no-files-found: error
