# Workflow para generar la APK de ArcaneChat de forma MANUAL.
# Cómo usarlo: GitHub -> Actions -> "Build ArcaneChat APK (Manual)" ->
# "Run workflow" -> elegir parámetros -> "Run workflow".
name: Build ArcaneChat APK (Manual)

on:
  push:
    branches:
      - arena/ddc22f4d-arcanechat
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor de la app a compilar"
        type: choice
        required: true
        default: foss
        options:
          - foss
          - gplay
      build_type:
        description: "Tipo de compilación"
        type: choice
        required: true
        default: Debug
        options:
          - Debug
          - Release
      abi_filter:
        description: "ABI a compilar (all = APK universal + splits por ABI)"
        type: choice
        required: true
        default: arm64-v8a
        options:
          - all
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

# Valores por defecto: al lanzarlo por push no hay inputs, y los pasos de abajo
# usan siempre estas variables.
env:
  FLAVOR: ${{ inputs.flavor || 'foss' }}
  BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}
  ABI_FILTER: ${{ inputs.abi_filter || 'arm64-v8a' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ArcaneChat APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # El runner ya trae ANDROID_HOME; instalamos los componentes exactos que pide
      # build.gradle (compileSdk 36 y ndkVersion 27.0.12077973) con sdkmanager.
      - name: Set up Android SDK and NDK r27
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;27.0.12077973"
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/ndk/27.0.12077973"

      - name: Rust cache for deltachat-core-rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: jni/deltachat-core-rust

      - name: Get deltachat-core-rust submodule hash
        id: core-hash
        run: echo "hash=$(git rev-parse HEAD:jni/deltachat-core-rust)" >> $GITHUB_OUTPUT

      - name: Restore compiled core
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            jni/arm64-v8a
            libs/arm64-v8a
          key: core-arm64-v8a-${{ steps.core-hash.outputs.hash }}-${{ hashFiles('jni/Android.mk', 'jni/Application.mk', 'jni/dc_wrapper.c', 'scripts/ndk-make.sh') }}-ndk-r27

      - name: Compile core (native libraries)
        id: compile-core
        if: steps.core-cache.outputs.cache-hit != 'true' && env.ABI_FILTER != 'all'
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.0.12077973"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export PATH="${PATH}:${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/"
          scripts/install-toolchains.sh && scripts/ndk-make.sh $ABI_FILTER

      - name: Compile core (all ABIs)
        if: steps.core-cache.outputs.cache-hit != 'true' && env.ABI_FILTER == 'all'
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.0.12077973"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export PATH="${PATH}:${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/"
          scripts/install-toolchains.sh && scripts/ndk-make.sh

      - name: Save compiled core
        if: steps['core-cache'].outputs.cache-hit != 'true' && steps['compile-core'].outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            jni/arm64-v8a
            libs/arm64-v8a
          key: ${{ steps['core-cache'].outputs.cache-primary-key }}

      - name: Resolve build parameters
        run: |
          build_dir=$(printf '%s' "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          build_cap=$(printf '%s' "$build_dir" | sed 's/^\(.\)/\U\1/')
          flavor_cap=$(printf '%s' "$FLAVOR" | sed 's/^\(.\)/\U\1/')
          echo "BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          echo "GRADLE_TASK=assemble${flavor_cap}${build_cap}" >> "$GITHUB_ENV"
          echo "building with $GRADLE_TASK into build/outputs/apk/$FLAVOR/$build_dir"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          set +e
          if [ "$ABI_FILTER" = "all" ]; then
            ./gradlew --no-daemon --stacktrace "$GRADLE_TASK" 2>&1 | tee /tmp/gradle.log
          else
            ./gradlew --no-daemon --stacktrace -PABI_FILTER=$ABI_FILTER "$GRADLE_TASK" 2>&1 | tee /tmp/gradle.log
          fi
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "==== resumen del fallo ===="
            grep -E "^e: |\.java:[0-9]+: error:|error: |What went wrong|Caused by:|FAILED$" /tmp/gradle.log | head -40
            echo "==== anotaciones ===="
            grep -E "^e: |\.java:[0-9]+: error:|What went wrong|Caused by:|error: " /tmp/gradle.log \
              | head -10 \
              | while IFS= read -r line; do
                  clean=$(printf '%s' "$line" | tr -d '%\r' | cut -c1-400)
                  echo "::error title=Gradle build::${clean}"
                done
          fi
          exit "$status"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneChat-${{ env.FLAVOR }}-${{ env.BUILD_TYPE }}-${{ env.ABI_FILTER }}
          path: 'build/outputs/apk/${{ env.FLAVOR }}/${{ env.BUILD_DIR }}/*.apk'
          if-no-files-found: error
